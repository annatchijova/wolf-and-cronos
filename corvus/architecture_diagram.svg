<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12121f"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="layerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2a4a"/>
      <stop offset="100%" stop-color="#33335c"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6e6e9e"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e0a95e"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1400" height="1000" fill="url(#bg)"/>

  <!-- Title -->
  <text x="700" y="52" text-anchor="middle" fill="#f2f2f8" font-size="34" font-weight="700" letter-spacing="4">CORVUS</text>
  <text x="700" y="78" text-anchor="middle" fill="#9a9ac0" font-size="15" letter-spacing="1">deterministic detection · AI explanation · MCP-native</text>

  <!-- ================= SLACK EVENT ================= -->
  <rect x="560" y="106" width="280" height="52" rx="10" fill="#1f1f38" stroke="#4a4a78" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="700" y="127" text-anchor="middle" fill="#dcdcf0" font-size="14" font-weight="600">SLACK EVENT</text>
  <text x="700" y="146" text-anchor="middle" fill="#8f8fb8" font-size="11">message.channels / message.groups</text>

  <line x1="700" y1="158" x2="700" y2="184" stroke="#6e6e9e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= INTAKE ================= -->
  <rect x="540" y="186" width="320" height="44" rx="9" fill="#22223e" stroke="#43436c" stroke-width="1.2"/>
  <text x="700" y="213" text-anchor="middle" fill="#cfcfe8" font-size="13" font-weight="600">INTAKE — normalize · resolve user/channel/thread</text>

  <line x1="700" y1="230" x2="700" y2="254" stroke="#6e6e9e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= MEMORY LAYER (left column feeding baseline) ================= -->
  <rect x="60" y="256" width="300" height="120" rx="10" fill="#1c2436" stroke="#3d5578" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="210" y="280" text-anchor="middle" fill="#bcd4ee" font-size="14" font-weight="700">MEMORY LAYER</text>
  <text x="210" y="300" text-anchor="middle" fill="#8fa9c8" font-size="11">SQLite (WAL) · Welford online baseline</text>
  <text x="210" y="317" text-anchor="middle" fill="#8fa9c8" font-size="11">per-user adaptive normal, not fixed thresholds</text>
  <text x="210" y="337" text-anchor="middle" fill="#8fa9c8" font-size="11">nightly sleep-consolidation batch</text>
  <text x="210" y="357" text-anchor="middle" fill="#6ee7c0" font-size="11" font-weight="600">SHA-256 audit hash chain</text>

  <!-- Memory -> analysis (baseline context) -->
  <path d="M 360 300 C 440 300, 460 300, 500 300" stroke="#e0a95e" stroke-width="2" fill="none" marker-end="url(#arrowGold)"/>
  <text x="430" y="290" text-anchor="middle" fill="#e0a95e" font-size="10" font-style="italic">baseline context</text>

  <!-- Intake -> memory -->
  <path d="M 560 208 C 420 208, 280 220, 220 254" stroke="#6e6e9e" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- ================= ANALYSIS LAYER ================= -->
  <rect x="500" y="256" width="560" height="330" rx="12" fill="#181830" stroke="#3a3a5e" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="780" y="282" text-anchor="middle" fill="#f0f0fa" font-size="14" font-weight="700" letter-spacing="1">ANALYSIS LAYER — deterministic, Fraction-exact</text>

  <!-- L1 -->
  <rect x="520" y="298" width="520" height="42" rx="7" fill="url(#layerGrad)" stroke="#4c4c80" stroke-width="1"/>
  <text x="536" y="324" fill="#ffffff" font-size="12.5" font-weight="700">L1 · Grice</text>
  <text x="640" y="324" fill="#b9b9dd" font-size="11.5">Maxim violations — Quantity · Quality · Relation · Manner</text>

  <!-- L2 -->
  <rect x="520" y="346" width="520" height="42" rx="7" fill="url(#layerGrad)" stroke="#4c4c80" stroke-width="1"/>
  <text x="536" y="372" fill="#ffffff" font-size="12.5" font-weight="700">L2 · Carnegie + Cialdini</text>
  <text x="720" y="372" fill="#b9b9dd" font-size="11.5">Influence tactics — Authority, Scarcity, Reciprocity…</text>

  <!-- L3 -->
  <rect x="520" y="394" width="520" height="42" rx="7" fill="url(#layerGrad)" stroke="#4c4c80" stroke-width="1"/>
  <text x="536" y="420" fill="#ffffff" font-size="12.5" font-weight="700">L3 · Aristotle</text>
  <text x="660" y="420" fill="#b9b9dd" font-size="11.5">Rhetorical imbalance — pathos overwhelming logos</text>

  <!-- L4 -->
  <rect x="520" y="442" width="520" height="42" rx="7" fill="url(#layerGrad)" stroke="#4c4c80" stroke-width="1"/>
  <text x="536" y="468" fill="#ffffff" font-size="12.5" font-weight="700">L4 · Berne</text>
  <text x="640" y="468" fill="#b9b9dd" font-size="11.5">Transactional analysis — crossed / ulterior transactions</text>

  <!-- L5 -->
  <rect x="520" y="490" width="520" height="42" rx="7" fill="url(#layerGrad)" stroke="#4c4c80" stroke-width="1"/>
  <text x="536" y="516" fill="#ffffff" font-size="12.5" font-weight="700">L5 · Forensic linguistics</text>
  <text x="760" y="516" fill="#b9b9dd" font-size="11.5">N/V ratio z-score · cognitive load · Zipf deviation</text>

  <!-- L6 -->
  <rect x="520" y="540" width="520" height="38" rx="7" fill="#2e2450" stroke="#7a5cc4" stroke-width="1.4"/>
  <text x="536" y="564" fill="#ffffff" font-size="12.5" font-weight="700">L6 · Peirce</text>
  <text x="640" y="564" fill="#d3c4f2" font-size="11.5">Abductive synthesis of L1–L5 across conversation trajectory</text>

  <!-- L1-L5 -> L6 -->
  <line x1="780" y1="532" x2="780" y2="540" stroke="#8a7ac0" stroke-width="2" marker-end="url(#arrowGold)"/>

  <line x1="780" y1="586" x2="780" y2="610" stroke="#6e6e9e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= VERDICT ENGINE ================= -->
  <rect x="580" y="612" width="400" height="72" rx="10" fill="#241a1a" stroke="#8a4a4a" stroke-width="1.6" filter="url(#softShadow)"/>
  <text x="780" y="638" text-anchor="middle" fill="#f5d9d9" font-size="14" font-weight="700">VERDICT ENGINE</text>
  <text x="780" y="657" text-anchor="middle" fill="#c99" font-size="11">corroboration gate (≥2 layers) · fractions.Fraction score</text>
  <text x="780" y="674" text-anchor="middle" fill="#8fc98f" font-size="11" font-weight="600">SILENT → WATCH → ALERT → CRITICAL</text>

  <!-- Verdict -> audit chain (write) -->
  <path d="M 580 660 C 420 660, 260 500, 220 376" stroke="#6ee7c0" stroke-width="1.8" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="330" y="560" fill="#6ee7c0" font-size="10" font-style="italic" text-anchor="middle">append to audit chain</text>

  <line x1="780" y1="684" x2="780" y2="710" stroke="#6e6e9e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= OUTPUT ROW ================= -->
  <text x="780" y="734" text-anchor="middle" fill="#9a9ac0" font-size="12" font-weight="600" letter-spacing="1">OUTPUTS</text>

  <!-- Slack alert -->
  <rect x="140" y="756" width="260" height="86" rx="10" fill="#1c1c34" stroke="#4a4a78" stroke-width="1.4" filter="url(#softShadow)"/>
  <text x="270" y="780" text-anchor="middle" fill="#e8e8f6" font-size="13" font-weight="700">Slack alert</text>
  <text x="270" y="798" text-anchor="middle" fill="#9a9ac0" font-size="10.5">thread reply · DM security</text>
  <text x="270" y="813" text-anchor="middle" fill="#9a9ac0" font-size="10.5">pinned + sealed bundle (CRITICAL)</text>
  <text x="270" y="831" text-anchor="middle" fill="#6ee7c0" font-size="10" font-style="italic">privacy by design — hashes only</text>

  <!-- AI explanation -->
  <rect x="430" y="756" width="260" height="86" rx="10" fill="#231a34" stroke="#7a4ec4" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="560" y="780" text-anchor="middle" fill="#efe4fb" font-size="13" font-weight="700">AI explanation</text>
  <text x="560" y="798" text-anchor="middle" fill="#c6aeed" font-size="10.5">Claude narrates sealed signals</text>
  <text x="560" y="813" text-anchor="middle" fill="#c6aeed" font-size="10.5">/corvus explain · deterministic fallback</text>
  <text x="560" y="831" text-anchor="middle" fill="#e0a95e" font-size="10" font-weight="600">explains, never decides</text>

  <!-- MCP server -->
  <rect x="720" y="756" width="260" height="86" rx="10" fill="#1a2a2a" stroke="#4ec4a0" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="850" y="780" text-anchor="middle" fill="#e0fbf2" font-size="13" font-weight="700">MCP server</text>
  <text x="850" y="798" text-anchor="middle" fill="#a0ded0" font-size="10.5">7 tools · analyze_message, baselines,</text>
  <text x="850" y="813" text-anchor="middle" fill="#a0ded0" font-size="10.5">audit chain, channel stats</text>
  <text x="850" y="831" text-anchor="middle" fill="#e0a95e" font-size="10" font-weight="600">persist=false by default</text>

  <!-- Audit chain -->
  <rect x="1010" y="756" width="260" height="86" rx="10" fill="#231a1a" stroke="#c46e4e" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="1140" y="780" text-anchor="middle" fill="#fbe4dc" font-size="13" font-weight="700">Audit chain</text>
  <text x="1140" y="798" text-anchor="middle" fill="#e0b3a0" font-size="10.5">SHA-256 hash-linked entries</text>
  <text x="1140" y="813" text-anchor="middle" fill="#e0b3a0" font-size="10.5">tamper is located, not just detected</text>
  <text x="1140" y="831" text-anchor="middle" fill="#e0a95e" font-size="10" font-weight="600">verify_audit_chain (MCP + /corvus audit)</text>

  <line x1="780" y1="710" x2="270" y2="756" stroke="#6e6e9e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="780" y1="710" x2="560" y2="756" stroke="#8a5cc4" stroke-width="1.6" marker-end="url(#arrowGold)"/>
  <line x1="850" y1="612" x2="850" y2="756" stroke="#4ec4a0" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#arrow)"/>
  <text x="880" y="700" fill="#4ec4a0" font-size="10" font-style="italic">external agents query</text>
  <line x1="780" y1="710" x2="1140" y2="756" stroke="#c46e4e" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ================= EXTERNAL AGENTS row ================= -->
  <rect x="720" y="900" width="260" height="60" rx="10" fill="#0f1f1a" stroke="#3a6e58" stroke-width="1.3" stroke-dasharray="3 3"/>
  <text x="850" y="925" text-anchor="middle" fill="#a0ded0" font-size="12" font-weight="600">Claude Desktop · IDE · CI pipeline</text>
  <text x="850" y="943" text-anchor="middle" fill="#6a9a88" font-size="10.5">any MCP client, same engine &amp; baselines</text>
  <line x1="850" y1="900" x2="850" y2="842" stroke="#4ec4a0" stroke-width="1.6" marker-end="url(#arrowGold)"/>

  <!-- Legend -->
  <g transform="translate(60,900)">
    <line x1="0" y1="6" x2="24" y2="6" stroke="#6e6e9e" stroke-width="2"/>
    <text x="30" y="10" fill="#8f8fb8" font-size="10.5">pipeline flow</text>
    <line x1="0" y1="28" x2="24" y2="28" stroke="#e0a95e" stroke-width="2"/>
    <text x="30" y="32" fill="#8f8fb8" font-size="10.5">baseline / narration context</text>
    <line x1="0" y1="50" x2="24" y2="50" stroke="#6ee7c0" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="30" y="54" fill="#8f8fb8" font-size="10.5">audit chain write / verify</text>
  </g>

  <text x="700" y="985" text-anchor="middle" fill="#5a5a80" font-size="11">Built for the Slack Agent Builder Challenge · Track: New Slack Agent</text>
</svg>
