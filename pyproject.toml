[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "corvus-cronos-bridge"
version = "0.1.0"
description = "Multi-agent rhetorical negotiation engine with tamper-evident audit trail"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
corvus-demo = "corvus_cronos.bridge:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["corvus_cronos*"]
exclude = ["tests*", "benchmark*", "scripts*"]
