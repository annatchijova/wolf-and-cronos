display_information:
  name: CRONOS
  description: Black Box Recorder for AI Agents — forensic observability for every decision your agents make.
  background_color: "#07080c"

features:
  bot_user:
    display_name: CRONOS
    always_online: true
  slash_commands:
    - command: /cronos
      description: "Explain agent decisions, list traces, verify audit chain"
      usage_hint: "explain | trace [agent_id] | audit | status | help"
      should_escape: false
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - commands
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - pins:write
      - reactions:write

settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
