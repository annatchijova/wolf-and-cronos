<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CORVUS × CRONOS</title>
<style>
  :root {
    --bg0: #0a0618;
    --bg1: #140b30;
    --panel: rgba(32, 22, 66, .58);
    --line: rgba(167, 139, 250, .22);
    --line-strong: rgba(167, 139, 250, .45);
    --ink: #f3f0ff;
    --muted: #8f8ab8;
    --lavender: #c4b5fd;
    --indigo: #615ced;
    --violet: #a855f7;
    --fuchsia: #d946ef;
    --grad: linear-gradient(135deg, #615ced 0%, #a855f7 55%, #d946ef 100%);
    --ok: #4ade80;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    font: clamp(15px, 0.55vw + 11px, 19px)/1.6 "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(ellipse 60rem 34rem at 12% -6%, rgba(97, 92, 237, .3), transparent),
      radial-gradient(ellipse 50rem 30rem at 100% 8%, rgba(217, 70, 239, .18), transparent),
      radial-gradient(ellipse 44rem 30rem at 50% 116%, rgba(168, 85, 247, .16), transparent),
      linear-gradient(180deg, var(--bg1), var(--bg0) 42%);
    background-attachment: fixed;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(196, 181, 253, .08) 1px, transparent 1px);
    background-size: 26px 26px;
    mask-image: linear-gradient(180deg, transparent, #000 16%, #000 84%, transparent);
  }
  main { position: relative; width: min(94vw, 1180px); margin: 0 auto; padding: 6vh 24px 8vh; }

  .topbar { display: flex; align-items: center; gap: 14px; margin-bottom: clamp(30px, 6vh, 64px); }
  .mark {
    width: 52px; height: 52px; border-radius: 15px; background: var(--grad);
    display: grid; place-items: center; font-weight: 800; font-size: 17px; color: #fff;
    box-shadow: 0 6px 24px rgba(168, 85, 247, .45), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .topbar .name { font-weight: 700; letter-spacing: .05em; font-size: clamp(16px, 1vw + 9px, 20px); }
  .topbar .name .x { background: var(--grad); -webkit-background-clip: text; background-clip: text;
    color: transparent; padding: 0 2px; }
  .langs { margin-left: auto; display: flex; gap: 4px; border: 1px solid var(--line);
    border-radius: 999px; padding: 3px; }
  .langs button {
    background: transparent; border: none; color: var(--muted); cursor: pointer;
    font: inherit; font-size: 13px; font-weight: 600; padding: 5px 14px; border-radius: 999px;
  }
  .langs button:hover { color: var(--ink); }
  .langs button.on { background: var(--grad); color: #fff; }

  .hero { margin: 0 auto clamp(34px, 6vh, 60px); max-width: 62ch; text-align: center; }
  .kicker { display: inline-block; font-size: 12px; letter-spacing: .18em; text-transform: uppercase;
    font-weight: 700; color: var(--lavender); border: 1px solid var(--line);
    padding: 6px 15px; border-radius: 999px; margin-bottom: 22px; }
  h1 { margin: 0 auto 18px; font-size: clamp(34px, 5.5vw + 8px, 76px); line-height: 1.04;
    letter-spacing: -.02em; font-weight: 800; max-width: 18ch; }
  h1 .g { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { margin: 0 auto; color: var(--muted); font-size: clamp(16px, 0.8vw + 11px, 22px);
    line-height: 1.6; max-width: 48ch; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 18px; }

  a.card {
    position: relative; display: flex; flex-direction: column; text-decoration: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 26px 26px 24px; backdrop-filter: blur(14px); color: var(--ink);
    transition: transform .18s, border-color .18s, box-shadow .18s;
    min-height: 230px;
  }
  a.card::before {
    content: ""; position: absolute; top: 0; left: 18px; right: 18px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(168,85,247,.7), transparent);
  }
  a.card:hover { transform: translateY(-4px); border-color: var(--line-strong);
    box-shadow: 0 20px 50px rgba(90, 30, 160, .35); }
  a.card.star {
    border-color: transparent;
    background:
      linear-gradient(rgba(26, 15, 58, .86), rgba(20, 11, 44, .86)) padding-box,
      var(--grad) border-box;
  }
  .cbadge { align-self: flex-start; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase;
    font-weight: 700; padding: 4px 11px; border-radius: 999px; margin-bottom: 16px;
    border: 1px solid var(--line-strong); color: var(--lavender); }
  a.card.star .cbadge { background: var(--grad); color: #fff; border-color: transparent; }
  .cmark { font-family: ui-monospace, Consolas, monospace; font-size: 13px; color: var(--lavender);
    letter-spacing: .05em; margin-bottom: 10px; }
  a.card h2 { margin: 0 0 8px; font-size: clamp(20px, 1.4vw + 12px, 28px); font-weight: 700; line-height: 1.15; }
  a.card p { margin: 0; color: var(--muted); font-size: clamp(13.5px, 0.4vw + 10.5px, 16px); line-height: 1.55; }
  .go { margin-top: auto; padding-top: 16px; font-weight: 600; color: var(--lavender);
    display: flex; align-items: center; gap: 6px; font-size: 14px; }
  a.card:hover .go { color: var(--ink); }
  .go .arrow { transition: transform .18s; }
  a.card:hover .go .arrow { transform: translateX(4px); }
  .needs { margin-top: 8px; font-size: 11.5px; color: #6e69a0; }

  .foot { margin-top: clamp(34px, 7vh, 64px); color: var(--muted); font-size: 13px;
    display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; justify-content: center;
    text-align: center; }
  .foot .qpill {
    border: 1px solid transparent; border-radius: 999px; padding: 5px 14px; font-size: 12px;
    background: linear-gradient(var(--bg1), var(--bg1)) padding-box, var(--grad) border-box;
  }
  .foot .qpill b { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .foot a {
    color: var(--lavender); text-decoration: none;
    border: 1px solid var(--line-strong); border-radius: 999px;
    padding: 8px 18px; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s, transform .15s;
  }
  .foot a:hover { color: var(--ink); border-color: var(--fuchsia);
    background: rgba(217, 70, 239, .1); transform: translateY(-1px); }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div class="mark">C×C</div>
    <div class="name">CORVUS <span class="x">×</span> CRONOS</div>
    <div class="langs" id="langs">
      <button data-lang="en">EN</button>
      <button data-lang="es">ES</button>
      <button data-lang="zh">中文</button>
    </div>
  </div>

  <div class="hero">
    <span class="kicker" data-i18n="kicker"></span>
    <h1 data-i18n-html="title"></h1>
    <p data-i18n="tagline"></p>
  </div>

  <div class="cards">
    <a class="card star" href="cronos.html">
      <span class="cbadge" data-i18n="cronosBadge"></span>
      <div class="cmark">CRONOS</div>
      <h2 data-i18n="cronosTitle"></h2>
      <p data-i18n="cronosDesc"></p>
      <span class="go"><span data-i18n="explore"></span> <span class="arrow">→</span></span>
    </a>

    <a class="card" href="demo.html">
      <span class="cbadge" data-i18n="wolfBadge"></span>
      <div class="cmark">CORVUS</div>
      <h2 data-i18n="wolfTitle"></h2>
      <p data-i18n="wolfDesc"></p>
      <span class="go"><span data-i18n="openDemo"></span> <span class="arrow">→</span></span>
    </a>

    <a class="card" href="dashboard.html">
      <span class="cbadge" data-i18n="liveBadge"></span>
      <div class="cmark">API</div>
      <h2 data-i18n="liveTitle"></h2>
      <p data-i18n="liveDesc"></p>
      <span class="needs" data-i18n="liveNeeds"></span>
      <span class="go"><span data-i18n="openConsole"></span> <span class="arrow">→</span></span>
    </a>
  </div>

  <div class="foot">
    <span class="qpill"><span data-i18n="poweredBy"></span> <b>Qwen</b> · DashScope</span>
    <span data-i18n="footNote"></span>
    <a href="overview.html" data-i18n="overviewLink"></a>
  </div>
</main>

<script>
"use strict";
const I18N = {
  en: {
    kicker: "Qwen Cloud Hackathon 2026 · Track 3",
    title: 'The wolf doesn\'t get to <span class="g">whisper unchallenged</span>.',
    tagline: "A tamper-evident reasoning engine: six frameworks detect manipulation, a hash chain seals every decision, and Qwen narrates — never judges.",
    cronosBadge: "The engine",
    cronosTitle: "CRONOS",
    cronosDesc: "The black box that makes an AI agent think before it acts — sealed hypotheses, discards, and confidence earned from evidence. With real reports from daily use.",
    explore: "Explore CRONOS",
    wolfBadge: "The demo",
    wolfTitle: "The Wolf & the Watchdogs",
    wolfDesc: "Replay a five-message social-engineering escalation. Watch six frameworks vote, the verdict seal, and the chain grow — every number precomputed by the real engine.",
    openDemo: "Open the demo",
    liveBadge: "Live",
    liveTitle: "Live console",
    liveDesc: "Analyze any message against the running engine, in three languages, with Qwen narration.",
    liveNeeds: "Needs the API running (local or Alibaba Cloud).",
    openConsole: "Open the console",
    poweredBy: "narrated by",
    footNote: "Built by Anna Tchijova · VIGÍA AI Collective.",
    overviewLink: "Integration overview →",
  },
  es: {
    kicker: "Qwen Cloud Hackathon 2026 · Track 3",
    title: 'El lobo no puede <span class="g">susurrar sin que lo desafíen</span>.',
    tagline: "Un motor de razonamiento a prueba de adulteración: seis marcos detectan manipulación, una cadena de hashes sella cada decisión y Qwen narra — nunca juzga.",
    cronosBadge: "El motor",
    cronosTitle: "CRONOS",
    cronosDesc: "La caja negra que hace que un agente de IA piense antes de actuar — hipótesis selladas, descartes y confianza ganada con evidencia. Con reportes reales de uso diario.",
    explore: "Explorar CRONOS",
    wolfBadge: "La demo",
    wolfTitle: "El Lobo y los Perros Guardianes",
    wolfDesc: "Reproducí una escalada de ingeniería social de cinco mensajes. Mirá votar a seis marcos, sellarse el veredicto y crecer la cadena — cada número precomputado por el motor real.",
    openDemo: "Abrir la demo",
    liveBadge: "En vivo",
    liveTitle: "Consola en vivo",
    liveDesc: "Analizá cualquier mensaje contra el motor corriendo, en tres idiomas, con narración Qwen.",
    liveNeeds: "Requiere la API corriendo (local o Alibaba Cloud).",
    openConsole: "Abrir la consola",
    poweredBy: "narrado por",
    footNote: "Hecho por Anna Tchijova · VIGÍA AI Collective.",
    overviewLink: "Visión general de la integración →",
  },
  zh: {
    kicker: "Qwen Cloud 黑客松 2026 · 赛道 3",
    title: '不能让狼<span class="g">悄无声息地得逞</span>。',
    tagline: "一个防篡改的推理引擎：六个框架检测操纵，一条哈希链密封每个决策，Qwen 负责叙述 —— 从不裁决。",
    cronosBadge: "引擎",
    cronosTitle: "CRONOS",
    cronosDesc: "让 AI 智能体在行动前先思考的黑匣子 —— 密封的假设、排除，以及由证据赢得的置信度。附真实日常使用的报告。",
    explore: "探索 CRONOS",
    wolfBadge: "演示",
    wolfTitle: "狼与看门狗",
    wolfDesc: "重放一场五条消息的社会工程升级攻击。观看六个框架投票、裁决密封、链条增长 —— 每个数字都由真实引擎预先计算。",
    openDemo: "打开演示",
    liveBadge: "实时",
    liveTitle: "实时控制台",
    liveDesc: "用三种语言、配合 Qwen 叙述，针对运行中的引擎分析任意消息。",
    liveNeeds: "需要 API 正在运行（本地或阿里云）。",
    openConsole: "打开控制台",
    poweredBy: "叙述引擎",
    footNote: "由 Anna Tchijova 打造 · VIGÍA AI Collective。",
    overviewLink: "集成总览 →",
  },
};

let LANG = localStorage.getItem("ccx_lang") || "en";
function apply() {
  const t = I18N[LANG];
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : LANG;
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-html]").forEach((el) => { el.innerHTML = t[el.dataset.i18nHtml]; });
  document.querySelectorAll("#langs button").forEach((b) => { b.classList.toggle("on", b.dataset.lang === LANG); });
}
document.querySelectorAll("#langs button").forEach((b) => {
  b.onclick = () => { LANG = b.dataset.lang; localStorage.setItem("ccx_lang", LANG); apply(); };
});
apply();
</script>
</body>
</html>
