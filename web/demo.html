<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CORVUS × CRONOS — Demo</title>
<style>
  /* ── Qwen palette: indigo → violet → fuchsia ─────────────────────── */
  :root {
    --bg0: #0a0618;
    --bg1: #140b30;
    --panel: rgba(32, 22, 66, .58);
    --line: rgba(167, 139, 250, .22);
    --line-strong: rgba(167, 139, 250, .45);
    --ink: #f3f0ff;
    --muted: #8f8ab8;
    --lavender: #c4b5fd;
    --indigo: #615ced;
    --violet: #a855f7;
    --fuchsia: #d946ef;
    --grad: linear-gradient(135deg, #615ced 0%, #a855f7 55%, #d946ef 100%);
    --ok: #4ade80;
    --watch: #fbbf24;
    --alert: #fb923c;
    --critical: #f43f5e;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    font: clamp(15px, 0.55vw + 11px, 19px)/1.6 "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(ellipse 60rem 34rem at 12% -6%, rgba(97, 92, 237, .28), transparent),
      radial-gradient(ellipse 50rem 30rem at 100% 8%, rgba(217, 70, 239, .16), transparent),
      radial-gradient(ellipse 44rem 30rem at 50% 110%, rgba(168, 85, 247, .14), transparent),
      linear-gradient(180deg, var(--bg1), var(--bg0) 40%);
    background-attachment: fixed;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(196, 181, 253, .08) 1px, transparent 1px);
    background-size: 26px 26px;
    mask-image: linear-gradient(180deg, transparent, #000 18%, #000 82%, transparent);
  }
  main { position: relative; width: min(96vw, 1780px); margin: 0 auto; padding: 34px 24px 70px; }

  header { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-bottom: 18px; }
  .mark {
    width: 56px; height: 56px; border-radius: 16px; background: var(--grad);
    display: grid; place-items: center; font-weight: 800; font-size: 20px;
    letter-spacing: -.02em; color: #fff;
    box-shadow: 0 6px 24px rgba(168, 85, 247, .45), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .wordmark h1 { margin: 0; font-size: clamp(21px, 1.4vw + 8px, 30px); letter-spacing: .05em; font-weight: 700; }
  .wordmark h1 .x {
    background: var(--grad); -webkit-background-clip: text; background-clip: text;
    color: transparent; padding: 0 2px; font-weight: 800;
  }
  .wordmark .sub { color: var(--muted); font-size: clamp(12.5px, 0.5vw + 9px, 16px); letter-spacing: .04em; }
  .pills { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .pill {
    font-size: 11.5px; letter-spacing: .08em; padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--lavender); white-space: nowrap;
  }
  .pill.qwen {
    border: 1px solid transparent;
    background:
      linear-gradient(var(--bg1), var(--bg1)) padding-box,
      var(--grad) border-box;
  }
  .pill.qwen b { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .langs { display: flex; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .langs button {
    background: transparent; border: none; box-shadow: none; color: var(--muted);
    font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 999px; cursor: pointer;
    font-family: inherit;
  }
  .langs button:hover { color: var(--ink); }
  .langs button.on { background: var(--grad); color: #fff; }

  .banner {
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
    border: 1px solid rgba(251, 191, 36, .35); border-radius: 12px;
    background: rgba(251, 191, 36, .07); color: var(--watch);
    padding: 10px 16px; margin-bottom: 22px; font-size: clamp(12.5px, 0.4vw + 10px, 15px);
  }
  .banner a { color: var(--lavender); }

  .grid { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 24px; }
  @media (max-width: 940px) { .grid { grid-template-columns: 1fr; } }

  .panel {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 28px 32px;
    backdrop-filter: blur(14px);
    box-shadow: 0 18px 50px rgba(6, 2, 24, .5);
  }
  .panel::before {
    content: ""; position: absolute; top: 0; left: 18px; right: 18px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(168,85,247,.7), transparent);
  }
  .panel h2 {
    margin: 0 0 16px; font-size: clamp(11.5px, 0.4vw + 9px, 14px); letter-spacing: .22em;
    text-transform: uppercase; color: var(--muted); font-weight: 700;
  }
  .panel h2 small { color: var(--muted); font-weight: 400; letter-spacing: .05em; text-transform: none; }

  .msgbox {
    background: rgba(10, 6, 26, .85); color: var(--ink);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; min-height: 96px; line-height: 1.55;
    font-size: clamp(13.5px, 0.45vw + 10px, 16.5px); white-space: pre-wrap;
  }
  .msgmeta { margin-top: 6px; color: var(--muted); font-size: 12px;
    font-family: ui-monospace, Consolas, monospace; }

  .wolfhead { margin: 18px 0 8px; font-size: 11px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button {
    cursor: pointer; font-family: inherit;
    font-size: clamp(12px, 0.4vw + 9px, 15px); padding: 7px 15px; font-weight: 500;
    background: rgba(97, 92, 237, .08); color: var(--lavender);
    border: 1px solid var(--line); border-radius: 12px;
    transition: border-color .15s, color .15s;
  }
  .chips button b {
    display: inline-grid; place-items: center; width: 18px; height: 18px;
    margin-right: 7px; border-radius: 50%; font-size: 10.5px; color: #fff;
    vertical-align: -3px;
  }
  .chips button:hover { border-color: var(--line-strong); color: var(--ink); }
  .chips button.on { border-color: var(--fuchsia); color: var(--ink);
    box-shadow: 0 0 14px rgba(217, 70, 239, .25); }

  .verdictrow { display: flex; align-items: center; gap: 16px; margin-top: 22px; flex-wrap: wrap; }
  .vbadge {
    padding: 10px 30px; border-radius: 999px; font-weight: 800;
    letter-spacing: .16em; font-size: clamp(15px, 0.7vw + 10px, 20px);
    border: 1px solid transparent;
  }
  .vbadge[data-l="SILENT"] {
    color: var(--lavender); border-color: var(--line);
    background: rgba(196, 181, 253, .07);
  }
  .vbadge[data-l="WATCH"] {
    color: var(--watch); border-color: rgba(251, 191, 36, .4);
    background: rgba(251, 191, 36, .1);
    box-shadow: 0 0 22px rgba(251, 191, 36, .18);
  }
  .vbadge[data-l="ALERT"] {
    color: var(--alert); border-color: rgba(251, 146, 60, .45);
    background: rgba(251, 146, 60, .12);
    box-shadow: 0 0 26px rgba(251, 146, 60, .25);
  }
  .vbadge[data-l="CRITICAL"] {
    color: #fff; border-color: rgba(244, 63, 94, .6);
    background: rgba(244, 63, 94, .3);
    box-shadow: 0 0 30px rgba(244, 63, 94, .45);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    50% { box-shadow: 0 0 44px rgba(244, 63, 94, .75); }
  }
  .scoretag { font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 13px; color: var(--lavender); }
  .scoretag b { color: var(--ink); font-size: clamp(16px, 1vw + 8px, 24px); }

  .scorewrap { position: relative; margin-top: 14px; }
  .scorebar {
    height: 16px; border-radius: 999px; overflow: hidden;
    background: rgba(10, 6, 26, .85); border: 1px solid var(--line);
  }
  .scorebar i {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, var(--indigo), var(--violet), var(--fuchsia), var(--critical));
    transition: width .6s cubic-bezier(.3, .9, .3, 1);
  }
  .tick { position: absolute; top: -4px; bottom: -4px; width: 1.5px;
    background: rgba(196, 181, 253, .5); }
  .tick span {
    position: absolute; top: -17px; left: 50%; transform: translateX(-50%);
    font-size: 9px; letter-spacing: .1em; color: var(--muted); white-space: nowrap;
  }
  .scoreline { display: flex; justify-content: space-between; color: var(--muted);
    font-size: 11px; margin-top: 6px; font-family: ui-monospace, Consolas, monospace; }

  .agents { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
  @media (max-width: 620px) { .agents { grid-template-columns: repeat(2, 1fr); } }
  .agent {
    display: flex; gap: 10px; align-items: center;
    border: 1px solid var(--line); border-radius: 13px; padding: 10px 12px;
    background: rgba(10, 6, 26, .5); transition: all .25s;
  }
  .agent .mono-badge {
    width: 38px; height: 38px; border-radius: 12px; flex: none;
    display: grid; place-items: center; font-weight: 800;
    font-size: clamp(13px, 0.5vw + 10px, 17px);
    background: rgba(97, 92, 237, .15); color: var(--muted);
    border: 1px solid var(--line);
  }
  .agent .txt b { display: block; font-size: clamp(12px, 0.4vw + 9px, 15px);
    letter-spacing: .06em; color: var(--muted); }
  .agent .txt span { font-size: clamp(10.5px, 0.35vw + 8px, 13px); color: #6e69a0; }
  .agent.fired { border-color: rgba(217, 70, 239, .5); background: rgba(168, 85, 247, .1);
    box-shadow: 0 0 18px rgba(168, 85, 247, .15); }
  .agent.fired .mono-badge { background: var(--grad); color: #fff; border-color: transparent; }
  .agent.fired .txt b { color: var(--ink); }
  .agent.fired .txt span { color: var(--lavender); }

  .block { margin-top: 20px; font-size: clamp(13.5px, 0.45vw + 10px, 16.5px); }
  .block h3 {
    margin: 0 0 6px; font-size: clamp(10.5px, 0.35vw + 8px, 13px); letter-spacing: .18em;
    text-transform: uppercase; color: var(--muted); font-weight: 700;
  }
  .block p { margin: 0; color: var(--ink); white-space: pre-wrap; }
  .block.dim p { color: var(--muted); }
  .block.qwenblock {
    border: 1px solid transparent; border-radius: 13px; padding: 13px 15px;
    background:
      linear-gradient(rgba(20, 11, 48, .92), rgba(20, 11, 48, .92)) padding-box,
      var(--grad) border-box;
  }
  .block.qwenblock h3 { background: var(--grad); -webkit-background-clip: text;
    background-clip: text; color: transparent; }
  .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 11.5px; word-break: break-all; color: var(--lavender); }

  .chainstate { display: flex; align-items: center; gap: 11px; margin-bottom: 16px; }
  .lamp { width: 13px; height: 13px; border-radius: 50%; background: #453e75; flex: none; }
  .lamp.ok  { background: var(--ok);       box-shadow: 0 0 14px rgba(74, 222, 128, .8); }
  .lamp.bad { background: var(--critical); box-shadow: 0 0 14px rgba(244, 63, 94, .8); }
  #chainText { font-size: 13px; color: var(--lavender); }

  .blocks { display: flex; align-items: center; gap: 0; overflow-x: auto;
    padding: 6px 2px 12px; scrollbar-width: thin; }
  .blk {
    flex: none; border: 1px solid var(--line); border-radius: 10px;
    padding: 7px 10px; background: rgba(10, 6, 26, .6); text-align: center;
  }
  .blk .h { font-family: ui-monospace, Consolas, monospace;
    font-size: clamp(10px, 0.35vw + 8px, 13px); color: var(--lavender); }
  .blk .a { font-size: clamp(9px, 0.3vw + 7px, 11px); letter-spacing: .1em;
    color: var(--muted); text-transform: uppercase; }
  .blk-link { flex: none; width: 18px; height: 1.5px;
    background: linear-gradient(90deg, var(--indigo), var(--fuchsia)); }

  .traces { margin-top: 4px; }
  .tr-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 4px;
    border-bottom: 1px solid rgba(167, 139, 250, .12);
    font-size: clamp(12.5px, 0.4vw + 9px, 15px);
  }
  .tr-row:last-child { border-bottom: none; }
  .tr-agent { flex: none; width: 96px; color: var(--lavender); font-weight: 600;
    font-size: 11px; letter-spacing: .06em; }
  .tr-dec { flex: 1; min-width: 0; color: var(--muted); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .q {
    flex: none; font-size: 9.5px; letter-spacing: .1em; padding: 3px 9px;
    border-radius: 999px; border: 1px solid var(--line); color: var(--muted);
  }

  .footer { margin-top: 30px; color: var(--muted); font-size: 12.5px; text-align: center; }
  .footer b { background: var(--grad); -webkit-background-clip: text;
    background-clip: text; color: transparent; font-weight: 700; }
  .hidden { display: none; }

  #result { animation: rise .45s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
</style>
</head>
<body>
<main>
  <header>
    <div class="mark">C×C</div>
    <div class="wordmark">
      <h1>CORVUS <span class="x">×</span> CRONOS</h1>
      <div class="sub" data-i18n="sub"></div>
    </div>
    <div class="pills">
      <div class="langs" id="langs">
        <button data-lang="en">EN</button>
        <button data-lang="es">ES</button>
        <button data-lang="zh">中文</button>
      </div>
      <span class="pill qwen"><span data-i18n="narratedBy"></span> <b>Qwen</b> · DashScope</span>
    </div>
  </header>

  <div class="banner">
    <span data-i18n="banner"></span>
    <a href="https://github.com/annatchijova/corvus-cronos-bridge" target="_blank" rel="noopener" data-i18n="runLive"></a>
  </div>

  <div class="grid">
    <!-- ── Left: message + verdict ───────────────────────────────── -->
    <section class="panel">
      <h2><span data-i18n="msgTitle"></span> <small data-i18n="msgSub"></small></h2>
      <div class="msgbox" id="msgText"></div>
      <div class="msgmeta" id="msgMeta"></div>

      <div class="wolfhead" data-i18n="wolfHead"></div>
      <div class="chips" id="wolfChips"></div>
      <div class="wolfhead" data-i18n="gauntletHead"></div>
      <div class="chips" id="gauntletChips"></div>

      <div id="result" class="hidden">
        <div class="verdictrow">
          <span class="vbadge" id="verdict" data-l="SILENT">SILENT</span>
          <span class="scoretag"><span data-i18n="score"></span> <b id="scorePctBig"></b> · <span data-i18n="exact"></span> <span id="scoreExact"></span></span>
        </div>
        <div class="scorewrap">
          <div class="scorebar"><i id="scoreFill"></i></div>
          <div class="tick" style="left:20%"><span>WATCH</span></div>
          <div class="tick" style="left:45%"><span>ALERT</span></div>
          <div class="tick" style="left:75%"><span>CRITICAL</span></div>
        </div>
        <div class="scoreline"><span>0</span><span data-i18n="noFloats"></span><span>100</span></div>

        <div class="agents" id="agents"></div>

        <div class="block"><h3 data-i18n="reco"></h3><p id="reco"></p></div>
        <div class="block dim"><h3 data-i18n="devil"></h3><p id="devil"></p></div>
        <div class="block qwenblock"><h3 id="narrTitle"></h3><p id="narration"></p></div>
        <div class="block dim">
          <h3 data-i18n="custody"></h3>
          <p class="mono" id="hashes"></p>
        </div>
      </div>
    </section>

    <!-- ── Right: chain snapshot ─────────────────────────────────── -->
    <section class="panel">
      <h2><span data-i18n="chainTitle"></span> <small data-i18n="chainSub"></small></h2>
      <div class="chainstate">
        <span class="lamp" id="chainLamp"></span>
        <span id="chainText"></span>
      </div>
      <div class="blocks" id="blocks"></div>
      <div class="traces" id="traceRows"></div>
    </section>
  </div>

  <div class="footer" id="footerLine"></div>
</main>

<script src="demo-data.js"></script>
<script>
"use strict";

/* ── UI translations ──────────────────────────────────────────────────── */
const I18N = {

      L5_LINGUISTIC: "registro + carga", L6_PEIRCE: "síntesis abductiva" },

    chainTitle: "CRONOS 链", chainSub: "— 本次分析后的快照",
    chainOk: "链已验证 — 每个哈希均正确链接",

    agentDescs: { L1_GRICE: "合作原则准则", L2_CARNEGIE: "卡内基 + 西奥迪尼",
      L3_ARISTOTLE: "情理逻三诉求", L4_BERNE: "自我状态",
      L5_LINGUISTIC: "语域 + 认知负荷", L6_PEIRCE: "溯因综合" },

    chainValid: "有效", chainBrokenWord: "断裂",
  },

let LANG = localStorage.getItem("ccx_lang") || "en";
const T = () => I18N[LANG];

const CHIP_COLORS = ["#615ced", "#7d5cf0", "#a855f7", "#c44df2", "#f43f5e"];
const AGENT_KEYS = ["L1_GRICE", "L2_CARNEGIE", "L3_ARISTOTLE", "L4_BERNE", "L5_LINGUISTIC", "L6_PEIRCE"];
const AGENT_MONO = { L1_GRICE: "G", L2_CARNEGIE: "C", L3_ARISTOTLE: "A",
  L4_BERNE: "B", L5_LINGUISTIC: "L", L6_PEIRCE: "P" };
const AGENT_NAMES = { L1_GRICE: "L1 Grice", L2_CARNEGIE: "L2 Influence", L3_ARISTOTLE: "L3 Rhetoric",
  L4_BERNE: "L4 Berne", L5_LINGUISTIC: "L5 Linguistics", L6_PEIRCE: "L6 Peirce" };

const $ = (id) => document.getElementById(id);
const DATA = window.DEMO_DATA || { samples: [] };
let currentId = null;

function applyLang() {
  const t = T();
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : LANG;
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    el.textContent = t[el.dataset.i18n];
  });
  $("footerLine").innerHTML = t.footer;
  document.querySelectorAll("#langs button").forEach((b) => {
    b.classList.toggle("on", b.dataset.lang === LANG);
  });
  buildChips();
  if (currentId) show(currentId);
}

function setLang(l) {
  LANG = l;
  localStorage.setItem("ccx_lang", l);
  applyLang();
}

function buildChips() {
  const wolf = DATA.samples.filter((s) => s.id.startsWith("wolf-"));
  const other = DATA.samples.filter((s) => !s.id.startsWith("wolf-"));
  const mk = (box, samples, numbered) => {
    box.innerHTML = "";
    samples.forEach((s, i) => {
      const b = document.createElement("button");
      const label = s.label[LANG] || s.label.en;
      b.innerHTML = numbered
        ? `<b style="background:${CHIP_COLORS[i]}">${i + 1}</b>${label}`
        : label;
      b.dataset.sid = s.id;
      b.classList.toggle("on", s.id === currentId);
      b.onclick = () => show(s.id);
      box.appendChild(b);
    });
  };
  mk($("wolfChips"), wolf, true);
  mk($("gauntletChips"), other, false);
}

function show(sid) {
  const t = T();
  const s = DATA.samples.find((x) => x.id === sid);
  if (!s) return;
  currentId = sid;
  document.querySelectorAll(".chips button").forEach((b) => {
    b.classList.toggle("on", b.dataset.sid === sid);
  });

  $("msgText").textContent = s.text;
  $("msgMeta").textContent = `${t.userLabel}: ${s.user_id}`;

  const d = s.result;
  $("result").classList.remove("hidden");
  const v = $("verdict");
  v.dataset.l = d.verdict; v.textContent = d.verdict;
  $("scoreExact").textContent = d.score.exact;
  $("scorePctBig").textContent = d.score.percent + "%";
  $("scoreFill").style.width = d.score.percent + "%";

  const grid = $("agents"); grid.innerHTML = "";
  for (const key of AGENT_KEYS) {
    const fired = d.active_agents.includes(key);
    const el = document.createElement("div");
    el.className = "agent" + (fired ? " fired" : "");
    el.innerHTML =
      `<div class="mono-badge">${AGENT_MONO[key]}</div>` +
      `<div class="txt"><b>${AGENT_NAMES[key]}</b>` +
      `<span>${fired ? t.fired : ""}${t.agentDescs[key]}</span></div>`;
    grid.appendChild(el);
  }

  $("reco").textContent = d.recommendation;
  $("devil").textContent = d.devils_advocate;

  const n = d.narration || {};
  if (n.text) {
    $("narrTitle").textContent = `${t.narrTitle} — ${n.model} (${n.lang})`;
    $("narration").textContent = n.text;
  } else {
    $("narrTitle").textContent = t.narrTitle;
    $("narration").textContent = n.note || t.narrNone;
  }

  $("hashes").textContent =
    `signal  ${d.audit.signal_hash}\n` +
    `verdict ${d.audit.verdict_hash}\n` +
    `chain   ${d.audit.chain_valid ? t.chainValid : t.chainBrokenWord} · ` +
    `${Object.keys(d.audit.trace_ids).length} ${t.tracesSealed}`;

  renderChain(s.chain);
}

function renderChain(chain) {
  const t = T();
  const ok = chain.verify.chain_ok;
  $("chainLamp").className = "lamp " + (ok ? "ok" : "bad");
  $("chainText").textContent = ok
    ? t.chainOk
    : t.chainBroken + (chain.verify.errors || []).join("; ");

  const traces = chain.traces || [];
  const blk = $("blocks"); blk.innerHTML = "";
  traces.slice().reverse().forEach((row, i) => {
    if (i > 0) {
      const link = document.createElement("div");
      link.className = "blk-link"; blk.appendChild(link);
    }
    const b = document.createElement("div");
    b.className = "blk";
    const h = (row.entry_hash || row.trace_id || "").slice(0, 8);
    b.innerHTML = `<div class="h">${h || "········"}</div>` +
                  `<div class="a">${(row.agent_id || "—").slice(0, 10)}</div>`;
    blk.appendChild(b);
  });

  $("traceRows").innerHTML = traces.map((row) => {
    const dec = row.decision || "—";
    const conf = row.confidence || "—";
    return `<div class="tr-row">` +
           `<span class="tr-agent">${row.agent_id || "—"}</span>` +
           `<span class="tr-dec" title="${dec.replace(/"/g, "&quot;")}">${dec}</span>` +
           `<span class="q" title="${t.confTitle}">${conf}</span></div>`;
  }).join("");
}

document.querySelectorAll("#langs button").forEach((b) => {
  b.onclick = () => setLang(b.dataset.lang);
});

applyLang();
if (DATA.samples.length) show(DATA.samples[DATA.samples.length - 1].id);
</script>
</body>
</html>
